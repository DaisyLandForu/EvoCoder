[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evocoder"
version = "0.2.0"
description = "Self-evolving coding agent runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.25.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
include = ["agents*", "benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["agents", "tests", "benchmarks"]
extend-exclude = [
  ".bear",
  "wiki",
  "docs",
  "data",
  "paper",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"agents/agent.py" = ["E", "F", "I"]
"agents/main.py" = ["E", "F", "I"]
"agents/memory.py" = ["E", "F", "I"]
"agents/online_skill_evolution.py" = ["E", "F", "I"]
"agents/prompt.py" = ["E", "F", "I"]
"agents/session_memory.py" = ["E", "F", "I"]
"agents/skill_evolution.py" = ["E", "F", "I"]
"agents/skills.py" = ["E", "F", "I"]
"agents/subagent.py" = ["E", "F", "I"]
"agents/tools.py" = ["E", "F", "I"]
"agents/ui.py" = ["E", "F", "I"]
